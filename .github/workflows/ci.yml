name: Matrix Calculator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Новый push отменяет незавершённый прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cmake и g++ уже установлены на раннере; doxygen, graphviz и valgrind
      # ставятся из conda-forge (зеркала apt на раннерах GitHub работали очень медленно)
      - name: Install dependencies
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: doxygen graphviz valgrind
          condarc: |
            channels:
              - conda-forge

      - name: Show tool versions
        run: |
          cmake --version
          g++ --version
          doxygen --version
          valgrind --version

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --verbose --output-on-failure

      - name: Check memory leaks
        run: |
          valgrind --leak-check=full --error-exitcode=1 \
            ./build/tests/matrix_tests

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html

name: Matrix Calculator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Новый push отменяет незавершённый прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          # Основное зеркало Ubuntu вместо зеркала GitHub, таймауты и повторы apt,
          # без долгого обновления man-db и без рекомендуемых пакетов
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends cmake g++ doxygen graphviz valgrind

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --verbose --output-on-failure

      - name: Check memory leaks
        run: |
          valgrind --leak-check=full --error-exitcode=1 \
            ./build/tests/matrix_tests

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html

  docker:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t matrix-calculator .

      - name: Run application in container
        run: docker run --rm matrix-calculator

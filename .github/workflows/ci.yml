name: Matrix Calculator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Новый push отменяет незавершённый прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cmake и g++ уже установлены на раннере; doxygen, graphviz и valgrind
      # ставятся из conda-forge (зеркала apt на раннерах GitHub работали очень медленно)
      - name: Install dependencies
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: doxygen graphviz
          condarc: |
            channels:
              - conda-forge

      # Valgrind берётся из apt: ему нужна отладочная информация системной glibc.
      # Зеркало Azure было недоступно, поэтому задан список альтернативных зеркал
      - name: Install Valgrind
        timeout-minutes: 8
        run: |
          printf '%s\n' http://mirrors.edge.kernel.org/ubuntu/ http://mirror.yandex.ru/ubuntu/ http://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
          sudo rm -f /var/lib/man-db/auto-update
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          sudo apt-get $APT_OPTS update || true
          sudo apt-get $APT_OPTS install -y --no-install-recommends valgrind

      - name: Show tool versions
        run: |
          cmake --version
          g++ --version
          doxygen --version
          valgrind --version

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --verbose --output-on-failure

      - name: Check memory leaks
        run: |
          valgrind --leak-check=full --error-exitcode=1 \
            ./build/tests/matrix_tests

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html

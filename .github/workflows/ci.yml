name: Matrix Calculator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Новый push отменяет незавершённый прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ doxygen graphviz valgrind

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --verbose --output-on-failure

      - name: Check memory leaks
        run: |
          set -o pipefail
          valgrind --leak-check=full --error-exitcode=1 \
            ./build/tests/matrix_tests 2>&1 | tee valgrind.log

      - name: Publish Valgrind summary
        if: always()
        run: |
          echo "### Valgrind (matrix_tests)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '==[0-9]+==' valgrind.log | tail -15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html
